<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal/css/jquery.terminal.min.css"/>
<style>
    #matrix-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 9999;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #matrix-canvas {
        width: 100%;
        height: 100%;
    }
    .loading-text {
        position: absolute;
        color: #c71585; /*mediumvioletred*/
        font-family: monospace;
        font-size: 24px;
        text-shadow: 0 0 5px #c71585; /*mediumvioletred*/
    }
</style>
</head>
<body>
<div id="matrix-loading">
    <canvas id="matrix-canvas"></canvas>
    <div class="loading-text">LOADING...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/jquery.terminal.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/figlet@1.5.2/lib/figlet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/xml_formatting.js"></script>
<script src="https://cdn.jsdelivr.net/npm/isomorphic-lolcat"></script>
<script>
// Matrix loading effect
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');

// Making the canvas full screen
canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

// Characters to print
const characters = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';

const fontSize = 10;
const columns = canvas.width / fontSize;

// Array of drops - one per column
const drops = [];

// x below is the x coordinate
// 1 = y coordinate of the drop (same for every drop initially)
for (let x = 0; x < columns; x++) {
    drops[x] = 1;
}

// Drawing the characters
function drawMatrix() {
    // Black with opacity
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Create gradient colors
    const gradientColors = ['#6c1df7'];
    
    // Looping over drops
    for (let i = 0; i < drops.length; i++) {
        // Pick a random character
        const text = characters.charAt(Math.floor(Math.random() * characters.length));
        
        // Calculate color based on position (y-coordinate)
        const colorIndex = Math.floor((drops[i] % canvas.height / fontSize) * gradientColors.length / 20) % gradientColors.length;
        ctx.fillStyle = gradientColors[colorIndex];
        
        // Draw the character with glow effect
        ctx.save();
        ctx.shadowColor = gradientColors[colorIndex];
        ctx.shadowBlur = 16;
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        ctx.restore();
        
        // Incrementing Y coordinate
        drops[i]++;
    }
}

// Start the Matrix animation
const matrixInterval = setInterval(drawMatrix, 33);

// Hide the matrix loading screen after terminal is loaded
window.addEventListener('load', function() {
    // Let matrix effect show for at least 2 seconds for effect
    setTimeout(function() {
        clearInterval(matrixInterval);
        document.getElementById('matrix-loading').style.display = 'none';
    }, 2250);
});
</script>
<script src="my-terminal.js"></script>
</body>
</html>
