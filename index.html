<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal/css/jquery.terminal.min.css"/>
</head>
<body>
<div id="matrix-loading">
    <canvas id="matrix-canvas"></canvas>
    <div class="loading-text">LOADING<br><span id="loading-hashtag">####</span></div>
    <script>
        // Simple animation to add more hashtags as it loads
        function loadHashtags() {
            var hashtag = document.getElementById('loading-hashtag');
            var count = 4;
            setInterval(function() {
            count++;
            hashtag.textContent += '#';
            if (count > 6) { // Reset after 6 hashtags
                hashtag.textContent = '#';
                count = 1;
            }
            }, 300);
        }
        loadHashtags();
    </script>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/jquery.terminal.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/figlet@1.5.2/lib/figlet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/xml_formatting.js"></script>
<script src="https://cdn.jsdelivr.net/npm/isomorphic-lolcat"></script>
<script src="loading-screen.js"></script>
<script src="my-terminal.js"></script>
</body>
</html>
